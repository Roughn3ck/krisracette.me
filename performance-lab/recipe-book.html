<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deschamps — Recipe Book</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
    background: #f5f5f5;
    color: #1a1a2e;
    min-height: 100vh;
  }
  .header {
    background: #1a1a2e;
    color: white;
    padding: 20px 30px;
    display: flex;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
  }
  .header h1 {
    font-size: 20pt;
    font-weight: 900;
    color: #e63946;
    letter-spacing: 1px;
  }
  .header .sub {
    color: #a8dadc;
    font-size: 10pt;
  }
  .selector-bar {
    background: white;
    padding: 15px 30px;
    border-bottom: 2px solid #e0e0e0;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .selector-bar label {
    font-weight: 700;
    font-size: 10pt;
    color: #457b9d;
  }
  .selector-bar select {
    padding: 8px 14px;
    font-size: 11pt;
    border: 2px solid #a8dadc;
    border-radius: 8px;
    background: white;
    min-width: 300px;
    cursor: pointer;
    font-family: inherit;
  }
  .selector-bar select:focus {
    outline: none;
    border-color: #457b9d;
  }
  .recipe-card {
    max-width: 800px;
    margin: 30px auto;
    background: white;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    overflow: hidden;
    display: none;
  }
  .recipe-card.active { display: block; }
  .recipe-header {
    background: #1a1a2e;
    color: white;
    padding: 24px 30px;
  }
  .recipe-header h2 {
    font-size: 18pt;
    color: #e63946;
    margin-bottom: 4px;
  }
  .recipe-header .meta {
    font-size: 9pt;
    color: #a8dadc;
  }
  .recipe-header .meta span {
    margin-right: 16px;
  }
  .recipe-body {
    padding: 24px 30px;
  }
  .macro-strip {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .macro-pill {
    flex: 1;
    min-width: 70px;
    background: #f1faee;
    border-radius: 8px;
    padding: 10px;
    text-align: center;
    border-left: 3px solid #e63946;
  }
  .macro-pill .val {
    font-size: 16pt;
    font-weight: 800;
    color: #1a1a2e;
  }
  .macro-pill .lbl {
    font-size: 7pt;
    color: #666;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  h3 {
    font-size: 13pt;
    color: #457b9d;
    margin: 18px 0 10px 0;
    border-bottom: 2px solid #a8dadc;
    padding-bottom: 4px;
  }
  .ingredient-list {
    list-style: none;
    padding: 0;
  }
  .ingredient-list li {
    padding: 5px 0;
    border-bottom: 1px solid #f0f0f0;
    display: flex;
    justify-content: space-between;
    font-size: 10pt;
  }
  .ingredient-list li:last-child { border-bottom: none; }
  .ingredient-list .qty { color: #e63946; font-weight: 700; }
  .instructions ol {
    padding-left: 20px;
    font-size: 10pt;
    line-height: 1.7;
  }
  .instructions ol li { margin-bottom: 6px; }
  .storage-box {
    background: #f1faee;
    border-radius: 8px;
    padding: 12px 16px;
    margin-top: 16px;
    font-size: 9.5pt;
    border-left: 4px solid #457b9d;
  }
  .storage-box strong { color: #457b9d; }
  .notes-box {
    background: #fff3e0;
    border-radius: 8px;
    padding: 12px 16px;
    margin-top: 12px;
    font-size: 9.5pt;
    border-left: 4px solid #f4a261;
  }
  .notes-box strong { color: #e76f51; }
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: #999;
  }
  .empty-state .icon { font-size: 40pt; margin-bottom: 10px; }
  .empty-state p { font-size: 11pt; }
  .footer {
    text-align: center;
    padding: 20px;
    font-size: 8pt;
    color: #aaa;
  }
</style>
</head>
<body>

<div class="header">
  <h1>DESCHAMPS</h1>
  <span class="sub">Recipe Book</span>
</div>

<div class="selector-bar">
  <label for="recipeSelect">Select a recipe:</label>
  <select id="recipeSelect">
    <option value="">— Choose a recipe —</option>
  </select>
</div>

<div id="recipeContainer">
  <div class="empty-state">
    <div class="icon">🍽️</div>
    <p>Select a recipe from the dropdown above</p>
  </div>
</div>

<div class="footer">
  Deschamps &middot; Diet Database &middot; Double-click to open
</div>

<!-- RECIPE DATA: edit diet_plan/recipes.js to add or change recipes -->

<script>
// ===== POPULATE DROPDOWN =====
const select = document.getElementById('recipeSelect');
recipes.forEach(r => {
  const opt = document.createElement('option');
  opt.value = r.id;
  opt.textContent = r.name;
  select.appendChild(opt);
});

// ===== RENDER =====
function renderRecipe(id) {
  const container = document.getElementById('recipeContainer');
  if (!id) {
    container.innerHTML = '<div class="empty-state"><div class="icon">🍽️</div><p>Select a recipe from the dropdown above</p></div>';
    return;
  }

  const r = recipes.find(x => x.id == id);
  if (!r) {
    container.innerHTML = '<div class="empty-state"><div class="icon">❓</div><p>Recipe not found</p></div>';
    return;
  }

  const prep = r.preparation || {};
  const instructions = prep.instructions || 'No instructions saved.';
  const storage = prep.storage || 'No storage notes.';

  let ingredientsHtml = '';
  if (r.ingredients && r.ingredients.length) {
    ingredientsHtml = '<ul class="ingredient-list">';
    r.ingredients.forEach(ing => {
      ingredientsHtml += `<li><span>${ing.name}</span><span class="qty">${ing.qty}</span></li>`;
    });
    ingredientsHtml += '</ul>';
  } else {
    ingredientsHtml = '<p style="color:#999;font-size:10pt;">No ingredients linked yet.</p>';
  }

  let notesHtml = '';
  if (r.notes) {
    notesHtml = `<div class="notes-box"><strong>Notes:</strong> ${r.notes}</div>`;
  }

  // Split instructions into steps
  const steps = instructions.split('\n').filter(s => s.trim());
  const stepsHtml = steps.map(s => `<li>${s.replace(/^\d+[\.\)]\s*/, '')}</li>`).join('');

  container.innerHTML = `
    <div class="recipe-card active">
      <div class="recipe-header">
        <h2>${r.name}</h2>
        <div class="meta">
          <span>🍽️ ${r.servings} serving${r.servings > 1 ? 's' : ''}</span>
          ${r.macros ? `<span>💪 ${r.macros.P}g protein</span>` : ''}
          ${r.macros ? `<span>🔥 ${r.macros.kcal} kcal</span>` : ''}
        </div>
      </div>
      <div class="recipe-body">
        ${r.macros ? `
        <div class="macro-strip">
          <div class="macro-pill"><div class="val">${r.macros.P}g</div><div class="lbl">Protein</div></div>
          <div class="macro-pill"><div class="val">${r.macros.F}g</div><div class="lbl">Fat</div></div>
          <div class="macro-pill"><div class="val">${r.macros.C}g</div><div class="lbl">Carbs</div></div>
          <div class="macro-pill"><div class="val">${r.macros.kcal}</div><div class="lbl">Calories</div></div>
        </div>
        ` : ''}

        <h3>Ingredients</h3>
        ${ingredientsHtml}

        <h3>Instructions</h3>
        <div class="instructions">
          <ol>${stepsHtml}</ol>
        </div>

        <div class="storage-box">
          <strong>Storage:</strong> ${storage}
        </div>

        ${notesHtml}
      </div>
    </div>
  `;
}

document.getElementById('recipeSelect').addEventListener('change', function() {
  renderRecipe(this.value);
});
</script>
</body>
</html>
